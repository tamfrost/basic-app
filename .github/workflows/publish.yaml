## https://github.com/tamfrost/basic-app/actions

name: Publish container

on:
  push:
    branches: [ca-signing]
  workflow_dispatch:
    inputs:
      run_on_mac:
        description: Run on macOS runner
        type: boolean
        default: false

# Required repository variables:
#   CONTAINER_REGISTRY - registry host, e.g. ghcr.io or containers.example.com
#   INFRA_REGISTRY     - full URL of the infra repo, e.g. https://github.com/tamfrost/infra
#   HELM_CHART_PATH    - path inside infra repo, e.g. helmcharts/basic-app
# Required repository secrets:
#   INFRA_PAT          - PAT with write access to the infra repo

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}
  INFRA_REGISTRY: ${{ vars.INFRA_REGISTRY }}
  HELM_CHART_PATH: ${{ vars.HELM_CHART_PATH }}

jobs:
  build-and-push:
    runs-on: ${{ (contains(github.event.head_commit.message, '[run on mac]') || inputs.run_on_mac) && fromJSON('["self-hosted", "macOS"]') || fromJSON('["self-hosted", "Linux"]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          # printf '%s' "${{ secrets.LYDIA_REGISTRY3_PASSWORD }}" | docker login ${{ vars.REGISTRY2 }} -u init --password-stdin

      - name: Build and push
        id: sha
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          # IMAGE_BASE_LYDIA="registry03.nykos.sys:8443/testing/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "short=$SHORT_SHA" >> $GITHUB_OUTPUT

          docker build \
            --build-arg GIT_COMMIT="${SHORT_SHA}" \
            --build-arg BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')" \
            -t "${IMAGE_BASE}:${SHORT_SHA}" .
          docker tag "${IMAGE_BASE}:${SHORT_SHA}" "${IMAGE_BASE}:latest"
          # docker tag "${IMAGE_BASE}:${SHORT_SHA}" "${IMAGE_BASE_LYDIA}:${SHORT_SHA}"
          # docker tag "${IMAGE_BASE}:${SHORT_SHA}" "${IMAGE_BASE_LYDIA}:latest"

          docker push "${IMAGE_BASE}:${SHORT_SHA}"
          docker push "${IMAGE_BASE}:latest"
          # docker push "${IMAGE_BASE_LYDIA}:${SHORT_SHA}"
          # docker push "${IMAGE_BASE_LYDIA}:latest"

      - name: Extract version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Helm chart versions and image tags
        shell: bash
        run: |
          SHORT_SHA="${{ steps.sha.outputs.short }}"
          VERSION="${{ steps.version.outputs.version }}"
          for chart in .helm/*/Chart.yaml; do
            perl -i -pe "s/^version:.*/version: $VERSION/" "$chart"
            perl -i -pe "s/^appVersion:.*/appVersion: \"$VERSION\"/" "$chart"
          done
          ACME_URL="${{ vars.ACME_DIRECTORY_URL || '-' }}"
          for values in .helm/*/values.yaml; do
            perl -i -pe "s/tag: \".*\"/tag: \"$SHORT_SHA\"/" "$values"
            perl -i -pe "s|acmeDirectoryUrl:.*|acmeDirectoryUrl: \"$ACME_URL\"|" "$values"
          done

      - name: Checkout infra repository
        shell: bash
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_PAT }}@${INFRA_REGISTRY#https://} infra-repo

      - name: Copy Helm charts to infra repository
        shell: bash
        run: |
          mkdir -p infra-repo/${{ env.HELM_CHART_PATH }}
          cp -r .helm/* infra-repo/${{ env.HELM_CHART_PATH }}/

      - name: Commit and push Helm chart
        shell: bash
        run: |
          cd infra-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.HELM_CHART_PATH }}/
          git commit -m "Update basic-app Helm chart to ${{ steps.version.outputs.version }} (${{ steps.sha.outputs.short }})" || echo "No changes to commit"
          git push

      # Option A — Proper webhook (preferred, no workflow step needed):
      #   Configure a webhook on the infra repo in GitHub:
      #     Payload URL:  https://<argocd-server>/api/webhook
      #     Content type: application/json
      #     Secret:       <shared secret, also set in ArgoCD>
      #   ArgoCD receives the push event and refreshes all apps that use the infra repo.

      # Option B — REST API sync from workflow (requires ARGOCD_SERVER var + ARGOCD_TOKEN secret,
      #   and ArgoCD must be reachable from the runner)
      # - name: Trigger ArgoCD sync
      #   shell: bash
      #   run: |
      #     APP="${{ vars.APP_NAME }}"
      #     for app in "$APP" "${APP}-x509" "${APP}-oauth2"; do
      #       curl -sk -o /dev/null -w "%{http_code} $app\n" \
      #         -X POST "${{ vars.ARGOCD_SERVER }}/api/v1/applications/$app/sync" \
      #         -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
      #         -H "Content-Type: application/json" \
      #         -d '{"prune":false,"dryRun":false}' || true
      #     done
