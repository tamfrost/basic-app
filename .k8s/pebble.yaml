apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:latest
          env:
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
            - name: PEBBLE_VA_ALWAYS_VALID
              value: "1"
          ports:
            - name: acme
              containerPort: 14000
            - name: management
              containerPort: 15000
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: cert-manager
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: 14000
---
apiVersion: v1
kind: Service
metadata:
  name: pebble-management
  namespace: cert-manager
spec:
  selector:
    app: pebble
  ports:
    - name: management
      port: 15000
      targetPort: 15000
